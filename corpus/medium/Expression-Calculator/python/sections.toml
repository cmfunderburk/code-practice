title = "Expression Calculator"

[[section]]
symbols = ["Node"]
cue = "The AST type: a plain tuple alias. Its three tagged shapes: number, negation, binary operator."

[[section]]
symbols = ["tokenize"]
cue = "Stage 1, scanner: skip spaces and tabs, group runs of digits, emit operators and parentheses one character each; anything else is a ValueError."

[[section]]
symbols = ["parse"]
cue = "Stage 2 entry: parse an expression from position 0 and reject any tokens left over."

[[section]]
name = "_expr + _term"
symbols = ["_expr", "_term"]
cue = "Precedence ladder, the binary levels: parse one operand from the level below, then fold left-associative + - (or * /) into (op, left, right) nodes. Each takes and returns a position."

[[section]]
symbols = ["_factor"]
cue = "Bottom of the ladder: end of input is an error; unary minus recurses into a factor; ( expr ) must close; a digit token is a number node; anything else is an unexpected token."

[[section]]
symbols = ["evaluate"]
cue = "Stage 3: match on the node shapes and recurse; / is true division. An unknown shape is a ValueError."

[[section]]
symbols = ["calculate"]
cue = "The pipeline: tokenize, parse, evaluate."

[[section]]
name = "main"
symbols = ["main", "__main__"]
cue = "Shell: read lines with input() until end of input or an empty line, print each result as Python prints it, and print error: for ValueError and ZeroDivisionError. Then the module guard."
