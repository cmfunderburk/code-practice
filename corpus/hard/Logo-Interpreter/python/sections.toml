title = "Logo Interpreter"

[[section]]
symbols = ["imports"]
cue = "What the program needs: from __future__ import annotations, so that Command can name its own type in its fields, and dataclass, for the frozen records."

[[section]]
name = "headings"
symbols = ["VECTORS", "HEADINGS"]
cue = "The four unit steps (east, north, west, south) and their letters \"ENWS\", both in counterclockwise order from east, so a heading is an index from 0 to 3 and a left turn adds 1."

[[section]]
symbols = ["Drawing"]
cue = "Everything the user can see, as one frozen dataclass: the turtle's position, its heading as an index into HEADINGS, whether the pen is down, and the tuple of segments drawn so far. The defaults are the starting state: (0, 0), heading east, pen down, no segments."

[[section]]
symbols = ["Command"]
cue = "A frozen dataclass for one parsed command: an op name and its argument (a distance for forward, a (count, body) pair for repeat, None for the rest). apply(drawing) returns a new drawing: forward moves by the heading's step times the distance and adds a segment only when the pen is down; left adds 1 to the heading and right subtracts 1, mod 4; penup and pendown set the pen; repeat applies each command of the body in turn, count times. Any other op raises ValueError(\"unknown command: <op>\"). inverse(before) returns Restore(before)."

[[section]]
symbols = ["Restore"]
cue = "Undoes a command: holds the drawing from before it, and its apply ignores the drawing passed to it and returns the held one."

[[section]]
symbols = ["_positive"]
cue = "Reads a count or distance with int(). If int() fails, raise ValueError(\"expected a positive integer, got <token>\"), with the token shown by repr; if the value is below 1, raise ValueError(\"counts and distances must be positive\")."

[[section]]
symbols = ["_parse"]
cue = "Parses uppercase words starting at a position, with a flag saying whether it is inside a block, and returns the tuple of commands and the next position. A ] ends a block, or raises \"unexpected ]\" outside one. FORWARD needs a distance after it (\"FORWARD needs a distance\"). LEFT, RIGHT, PENUP, and PENDOWN become commands with lowercase op names. REPEAT needs a count followed by [ (\"REPEAT needs a count and [ block ]\"), then calls itself to read the block. Any other word raises \"unknown command: <word>\". Running out of words inside a block raises \"missing ]\"."

[[section]]
symbols = ["parse"]
cue = "Puts spaces around [ and ], converts to uppercase, splits on whitespace, and parses the words from position 0, outside any block; returns just the commands."

[[section]]
symbols = ["render"]
cue = "Turns parsed commands back into source, words joined by single spaces: FORWARD n, REPEAT n [ <body, rendered the same way> ], and every other command as its op name in uppercase."

[[section]]
symbols = ["Logo"]
cue = "Holds the current drawing, starting from Drawing(), and a list of Restores used as an undo stack. Read-only properties give position, heading as its letter from HEADINGS, pen_down, and segments. execute parses the whole source first, so a bad line changes nothing; then, for each top-level command, it applies the command and pushes the command's inverse of the drawing from before. undo raises ValueError(\"nothing to undo\") when the stack is empty; otherwise it pops a Restore and applies it."

[[section]]
symbols = ["_is_undo"]
cue = "True when the line's only word, in uppercase, is UNDO."

[[section]]
symbols = ["_report"]
cue = "Builds the text printed after a successful line: the state line \"x=<x> y=<y> heading=<letter> pen=down|up segments=<count>\", then one line \"<x1>,<y1> -> <x2>,<y2>\" per segment, oldest first, joined with newlines."

[[section]]
name = "main"
symbols = ["main", "__main__"]
cue = "The program's loop: make one Logo, then read lines with input() until end of input. A line that _is_undo accepts calls undo; every other line, an empty one included, goes to execute. On ValueError print \"error: <message>\"; otherwise print the report. Then the if __name__ == \"__main__\" guard."
