title = "Roman Numerals"

[[section]]
name = "tables"
symbols = ["VALUES", "ROMAN_TABLE"]
cue = "The two tables: each of the seven letters to its value, and the thirteen (value, symbol) render pairs from 1000 down to 1, subtractive pairs included."

[[section]]
symbols = ["to_roman"]
cue = "Render: ValueError outside 1..3999 (out of range: n); otherwise walk the render table greedily, taking each symbol as many times as its value divides what remains."

[[section]]
symbols = ["from_roman"]
cue = "Parse, assuming canonical input: sum the letter values, subtracting any letter worth less than the one after it."

[[section]]
symbols = ["_canonical"]
cue = "Shell predicate: the round-trip law as a validator. A numeral is canonical when rendering its parse gives it back; a ValueError from the render means not canonical."

[[section]]
name = "main"
symbols = ["main", "__main__"]
cue = "Composition root: read lines with input() until end of input, each trimmed and folded to uppercase. ASCII digits print their numeral, or the range error as error:; an empty line or one with a non-numeral letter prints an error: usage hint; a canonical numeral prints its value, any other prints error: not a canonical numeral: line. Then the module guard."
