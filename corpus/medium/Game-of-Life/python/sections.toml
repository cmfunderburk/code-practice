title = "Game of Life"

[[section]]
symbols = ["imports"]
cue = "The imports: sys, to read stdin, and Counter from collections, to count each cell's live neighbours."

[[section]]
symbols = ["step"]
cue = "One generation on the set of live (row, column) cells: with a Counter, add one to the count of each of the eight neighbours of every live cell. Keep a counted cell if its count is 3, or 2 and it is already live, and only if it lies inside the rows × cols grid. Return a new set."

[[section]]
symbols = ["parse_input"]
cue = "Check the text against SPEC §2 and return rows, cols, generations, and the grid lines. Split it with splitlines (an empty input becomes one empty header line) and read the header with map(int, header.split()). Each failure raises ValueError with a message, which main prints: a header that is not three integers, \"header needs rows cols generations: {header!r}\"; rows or cols outside 1-100 or generations outside 0-1000, \"need 1-100 rows and cols, 0-1000 generations: {header!r}\"; the wrong number of grid lines, \"expected {rows} grid lines, got {len(grid)}\"; a line that is not cols characters of '#' or '.', \"row {r} must be {cols} of '#' or '.': {line!r}\"."

[[section]]
symbols = ["_render"]
cue = "The board as text: rows lines of cols characters, '#' for a live cell and '.' for a dead one, joined by newlines."

[[section]]
name = "main"
symbols = ["main", "__main__"]
cue = "Read all of stdin with sys.stdin.read() and pass it to parse_input; if that raises ValueError, print \"error: <message>\" and stop. Otherwise build the set of live (row, column) cells from the grid's # characters, then for each generation g from 0 through generations print \"gen <g>\" and the board from _render, calling step before every generation except 0 and keeping the set it returns. Then the if __name__ == \"__main__\" guard."
