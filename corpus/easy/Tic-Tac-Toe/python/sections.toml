title = "Tic-Tac-Toe"

[[section]]
name = "board"
symbols = ["EMPTY_BOARD", "_LINES"]
cue = "The starting board, nine empty strings, and the eight winning lines as triples of cell numbers: the three rows, then the three columns, then the two diagonals."

[[section]]
symbols = ["to_move"]
cue = "Whose turn: X when the board holds as many X marks as O marks, otherwise O."

[[section]]
symbols = ["winner"]
cue = "The mark that fills any of the eight lines in _LINES, or None if no line is filled."

[[section]]
symbols = ["is_draw"]
cue = "True when nobody has won and no cell is empty."

[[section]]
symbols = ["legal_moves"]
cue = "The cells that may be played: none once someone has won, otherwise the numbers of the empty cells."

[[section]]
symbols = ["play"]
cue = "Make a move: raise ValueError(\"illegal move: pos\") if pos is not among the legal moves; otherwise return a new board with the mark of the player to move in that cell, leaving the old board unchanged."

[[section]]
symbols = ["_render"]
cue = "The board as text: three rows, each with its cells separated by spaces and . for an empty cell, the rows joined by newlines."

[[section]]
name = "main"
symbols = ["main", "__main__"]
cue = "The game loop: start from EMPTY_BOARD and repeat while nobody has won and the game is not a draw. Print the rendered board and \"X to move\" or \"O to move\", then read a line with input(); at end of input print \"game abandoned\" and return. If int() can't read the line, print \"a cell 0-8, please\". Otherwise pass the number to play: if it raises ValueError (a marked cell, or one off the board), print the message; if not, keep the new board. At the end, print the final board and then \"X wins!\", \"O wins!\", or \"draw\". Then the if __name__ == \"__main__\" guard."
