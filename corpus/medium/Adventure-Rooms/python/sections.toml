title = "Adventure Rooms"

[[section]]
symbols = ["imports"]
cue = "Import Callable from collections.abc, for the type of the handlers in VERBS."

[[section]]
name = "world"
symbols = ["DIRECTIONS", "DESCRIPTIONS", "EXITS", "START_ITEMS"]
cue = "The map: the four directions in the order north, south, east, west; each room's description (hall: a dusty entrance hall; library: a book-lined library; cellar: a damp stone cellar; attic: a cramped attic; garden: an overgrown garden); each room's exits (hall: north to library, west to garden; library: south to hall, north to attic, west to cellar; cellar: east to library; attic: south to library; garden: east to hall); and the items each room starts with (hall: lamp; library: book; cellar: key; attic: none; garden: rose, spade)."

[[section]]
symbols = ["State"]
cue = "State is another name for dict: a game's state is one dict, which the command handlers change in place."

[[section]]
symbols = ["new_game"]
cue = "Return a new game's state: in the hall, with an empty inventory, a fresh copy of every room's item list, and not over."

[[section]]
symbols = ["_look"]
cue = "Describe the current room: \"You are in <description>.\", then \"Exits: \" and the room's exits in north, south, east, west order, separated by commas and ending with a period, then, only if the room holds items, \"You see: \" and its items the same way. Join the lines with newlines."

[[section]]
symbols = ["_do_look"]
cue = "The look command: return the state unchanged and the room's description."

[[section]]
symbols = ["_do_go"]
cue = "The go command: answer \"Go where?\" with no argument, and \"You can't go that way.\" for a direction with no exit from this room; otherwise move to the room that exit leads to and return its description."

[[section]]
symbols = ["_do_take"]
cue = "The take command: answer \"Take what?\" with no argument, and \"There is no <item> here.\" if the room doesn't hold it; otherwise move it from the room's list to the end of the inventory and answer \"Taken.\""

[[section]]
symbols = ["_do_drop"]
cue = "The drop command: answer \"Drop what?\" with no argument, and \"You are not carrying <item>.\" if the inventory doesn't hold it; otherwise move it from the inventory to the end of the room's list and answer \"Dropped.\""

[[section]]
symbols = ["_do_inventory"]
cue = "The inventory command: \"You are carrying nothing.\" when the inventory is empty, otherwise \"You are carrying: \" and the items in order, separated by commas and ending with a period."

[[section]]
symbols = ["_do_quit"]
cue = "The quit command: mark the game over and answer \"Goodbye.\""

[[section]]
symbols = ["VERBS"]
cue = "The table from each command word to the function that handles it, annotated as a dict of Callables that take (state, arg) and return (state, output)."

[[section]]
symbols = ["execute"]
cue = "Run one command: after quit, raise ValueError(\"the game is over\"); split the stripped line at the first space into a verb and an argument; raise ValueError(\"unknown verb: <verb>\") if the verb is not in VERBS; otherwise call its handler with the argument stripped."

[[section]]
name = "main"
symbols = ["main", "__main__"]
cue = "The program's loop: create a new game and print its description. Then, until the game is over, read a line with input(), stopping without printing anything at EOFError; pass it to execute, keep the state it returns, and print the output, or, if execute raises ValueError, print its message as it is and keep the old state. Then the if __name__ == \"__main__\" guard."
