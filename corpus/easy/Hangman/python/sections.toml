title = "Hangman"

[[section]]
symbols = ["imports"]
cue = "What the program needs: random to pick the word, string for the lowercase alphabet, and dataclass to define an immutable record."

[[section]]
symbols = ["WORDS"]
cue = "The built-in word list main picks from: eight lowercase words, each with at least two different letters."

[[section]]
symbols = ["HangmanState"]
cue = "The game's state as one immutable value: the secret word, the set of letters guessed so far, and the number of misses allowed."

[[section]]
symbols = ["new_game"]
cue = "Start a game for a secret word with nothing guessed; the number of misses allowed defaults to 6."

[[section]]
symbols = ["wrong_count"]
cue = "How many of the guessed letters are not in the secret."

[[section]]
symbols = ["masked"]
cue = "The secret with each letter not yet guessed shown as _."

[[section]]
symbols = ["status"]
cue = "\"won\" once every letter of the secret is guessed, \"lost\" once the misses reach the number allowed, otherwise \"playing\". Check for a win first."

[[section]]
symbols = ["guess"]
cue = "Refuse a guess once the game is over (ValueError(\"game is over: <status>\")) or a letter already guessed (ValueError(\"already guessed: <letter>\")); otherwise return a new state with the letter added, leaving the old state unchanged."

[[section]]
name = "main"
symbols = ["main", "__main__"]
cue = "The program's loop: pick the secret with random.choice(WORDS) and start one game with new_game. While the game is playing, print the mask, two spaces, and \"wrong: <misses>/<max_wrong>\", then read a line with input(), removing surrounding spaces and converting it to lowercase. At end of input, print \"you quit! the word was <secret>\" and return. A line that is not one letter a-z prints \"one letter a-z, please\". Otherwise call guess: print the message of any ValueError it raises, or else keep the new state it returns. When the game ends, print \"you won! the word was <secret>\" or \"you lost! the word was <secret>\". Then the if __name__ == \"__main__\" guard."
