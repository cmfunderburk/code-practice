title = "Editor Buffer"

[[section]]
symbols = ["imports"]
cue = "The import: dataclass, used to make the two edit records immutable."

[[section]]
symbols = ["HELP"]
cue = "The usage line printed for any line that is not a command: \"i <pos> <text> | d <pos> <n> | u | r | p | q\"."

[[section]]
symbols = ["Insert"]
cue = "An immutable record of one insert: a position and the text inserted there. apply takes a text and returns it with this text placed at the position; invert returns the Delete of the same position and text."

[[section]]
symbols = ["Delete"]
cue = "An immutable record of one delete: a position and the text removed from there. apply takes a text and returns it with that many characters cut out at the position; invert returns the Insert of the same position and text."

[[section]]
symbols = ["EditorBuffer"]
cue = "The buffer: its text (empty unless given, read through a text property) and two lists used as stacks, one of edits to undo and one of edits to redo. insert accepts a position from 0 to the length of the text, else raises ValueError(\"insert out of range: <pos>\"). delete needs n of at least 1 and pos + n within the text, else raises ValueError(\"delete out of range: <pos>+<n>\"), and saves the removed text in its Delete. One private method applies an edit, pushes it on the undo stack, and clears the redo stack. undo pops an edit, applies its inverse, and pushes the edit on the redo stack; redo pops an edit, applies it again, and pushes it on the undo stack. Each raises ValueError(\"nothing to undo\") or ValueError(\"nothing to redo\") when its stack is empty."

[[section]]
symbols = ["_number"]
cue = "A position or count: the text as an int if it is all ASCII digits, else None."

[[section]]
symbols = ["_command"]
cue = "Split a line into its verb and a tuple of arguments, or return None if it is not a command. u, r, p, and q count only as the whole line. i needs a number, then a space, and the rest of the line is its text; d needs exactly two numbers separated by one space."

[[section]]
name = "main"
symbols = ["main", "__main__"]
cue = "The program's loop: start with an empty buffer and read lines with input() until end of input. A line that is not a command prints HELP; q stops; i, d, u, and r call the buffer's methods; p prints the text between double quotes. A ValueError from the buffer prints its message as it is. Then the if __name__ == \"__main__\" guard."
